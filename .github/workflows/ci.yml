name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The version comes from .nvmrc, so CI and local development cannot
      # drift. `engines` in both package.json files plus engine-strict in
      # .npmrc make a wrong version fail at install time with a clear message.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json

      - name: Show toolchain
        run: node --version && npm --version

      - name: Install site dependencies
        run: npm ci

      - name: Install game dependencies
        run: npm ci
        working-directory: game

      # Not yet blocking: `npm run lint` still reports a handful of pre-existing
      # errors (see AGENTS.md §7). Drop continue-on-error once they are fixed.
      - name: Lint site
        run: npm run lint
        continue-on-error: true

      - name: Test site
        run: npm test

      # The game must be built BEFORE the site: it outputs into public/game,
      # which the site build then copies into dist/.
      - name: Build game
        run: npm run build
        working-directory: game

      - name: Build site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
